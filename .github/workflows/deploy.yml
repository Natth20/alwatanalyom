name: deploy
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Web
        run: |
          docker build -f infra/docker/web.Dockerfile -t ghcr.io/${{ github.repository }}/awt-web:${{ github.ref_name }} -t ghcr.io/${{ github.repository }}/awt-web:latest .
          docker push --all-tags ghcr.io/${{ github.repository }}/awt-web

      - name: Build & Push Admin
        run: |
          docker build -f infra/docker/admin.Dockerfile -t ghcr.io/${{ github.repository }}/awt-admin:${{ github.ref_name }} -t ghcr.io/${{ github.repository }}/awt-admin:latest .
          docker push --all-tags ghcr.io/${{ github.repository }}/awt-admin

      - name: Build & Push Worker
        run: |
          docker build -f infra/docker/worker.Dockerfile -t ghcr.io/${{ github.repository }}/awt-worker:${{ github.ref_name }} -t ghcr.io/${{ github.repository }}/awt-worker:latest .
          docker push --all-tags ghcr.io/${{ github.repository }}/awt-worker

      - name: Deploy to Server via SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Deploying ${{ github.ref_name }} to production..."
          # ssh deploy@${{ secrets.SERVER_HOST }} "cd /srv/awt && TAG=${{ github.ref_name }} ./deploy.sh"

